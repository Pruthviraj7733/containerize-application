apiVersion: apps/v1
kind: Deployment

metadata:
  name: java-application

spec:
  replicas: 2

  selector:
    matchLabels:
      app: java-application

  template:
    metadata:
      labels:
        app: java-application

    spec:
      containers:
        - name: java-application

          image: pmarkad/java-application:41

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /java-application/
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /java-application/
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
